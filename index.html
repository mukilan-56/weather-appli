<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IoT Weather Station Dashboard</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #007bff;
      --temp-color: #e74c3c;
      --humidity-color: #3498db;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 25px;
      color: #444;
    }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      padding: 20px;
      border-radius: 8px;
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
    }

    .card h2 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6c757d;
      margin: 0 0 10px 0;
    }

    .value {
      font-size: 2rem;
      font-weight: bold;
    }

    .temp { color: var(--temp-color); }
    .humidity { color: var(--humidity-color); }

    .status {
      font-size: 0.85rem;
      color: #6c757d;
      margin-top: 15px;
    }

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #28a745;
      border-radius: 50%;
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Weather Monitoring System</h1>
    
    <div class="data-grid">
      <div class="card">
        <h2>Temperature</h2>
        <div id="temperature" class="value temp">-- °C</div>
      </div>
      <div class="card">
        <h2>Humidity</h2>
        <div id="humidity" class="value humidity">-- %</div>
      </div>
    </div>

    <div class="status">
      <span class="live-dot"></span><span id="status-text">Connecting to Firebase...</span>
    </div>
  </div>

  <!-- Firebase App & Realtime Database SDKs (v10 Modular via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBDUn68-1MiIUoR-XC0WNWxVPb3xER-ezs",
      authDomain: "iot-weather-application-5f7d4.firebaseapp.com",
      databaseURL: "https://iot-weather-application-5f7d4-default-rtdb.firebaseio.com",
      projectId: "iot-weather-application-5f7d4",
      storageBucket: "iot-weather-application-5f7d4.firebasestorage.app",
      messagingSenderId: "88968472378",
      appId: "1:88968472378:web:31c33d7a10d613abcb5203",
      measurementId: "G-GNHVW67Y1K"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // References to UI elements
    const tempElement = document.getElementById("temperature");
    const humidityElement = document.getElementById("humidity");
    const statusElement = document.getElementById("status-text");

    // Reference to your database path (Adjust '/weather' if your database node structure is different)
    const weatherRef = ref(db, 'weather');

    // Listen for live database updates
    onValue(weatherRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        tempElement.innerText = (data.temperature !== undefined ? data.temperature : '--') + ' °C';
        humidityElement.innerText = (data.humidity !== undefined ? data.humidity : '--') + ' %';
        statusElement.innerText = 'Connected - Live updates active';
      } else {
        statusElement.innerText = 'Connected - No data available at path /weather';
      }
    }, (error) => {
      console.error("Firebase Read Error:", error);
      statusElement.innerText = 'Error loading data from Firebase';
    });
  </script>
</body>
</html>
